name: Validate VANTIX Attestor Portfolio Preview

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify release ledger
        run: python scripts/verify_checksums.py

      - name: Validate repository controls
        run: python validation/validate_repository.py
